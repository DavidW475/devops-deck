name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Release only from main, and only versions that have no tag yet.
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ] \
            && [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Version $version is new and will be released."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm test

      - name: Package extension
        run: npx vsce package --out devops-deck.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: devops-deck-vsix
          path: devops-deck.vsix
          if-no-files-found: error

  sonar:
    runs-on: ubuntu-latest
    # Secrets are not available to PRs from forks or Dependabot; skip instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for blame information and new-code detection

      - uses: actions/setup-node@v7
        if: env.SONAR_TOKEN != ''
        with:
          node-version: 24
          cache: npm

      - name: Tests with coverage
        if: env.SONAR_TOKEN != ''
        run: npm ci && npm run test:coverage

      - name: SonarQube analysis
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            ${{ vars.SONAR_ORGANIZATION != '' && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}

  publish:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # Checkout + npm ci so publishing uses the vsce version from package-lock.json (kept current by Dependabot).
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: devops-deck-vsix

      - name: Publish to Visual Studio Marketplace
        # --skip-duplicate lets a re-run succeed if only the GitHub release step failed.
        run: npx vsce publish --packagePath devops-deck.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create tag and GitHub release
        run: |
          gh release create "v$VERSION" devops-deck.vsix \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
