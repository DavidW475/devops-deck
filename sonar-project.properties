sonar.projectKey=DavidW475_devops-deck
sonar.projectName=DevOps Deck for Azure DevOps

sonar.sources=src,media
sonar.tests=src/test
sonar.exclusions=src/test/**,media/screenshots/**,media/*.png,media/*.svg
sonar.test.inclusions=src/test/**/*.test.ts
sonar.sourceEncoding=UTF-8

# Unit test coverage from `npm run test:coverage`. Webview scripts in media/ run in the browser and are not unit tested.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=media/**
